# Tech profile — matches the current default behaviour of the pipeline.
# When AGENT_PROFILE=tech (the default), this file's values override settings.py
# defaults. Since values here match the hardcoded defaults exactly, behaviour
# is identical to pre-profile pipeline.
#
# To replicate for a new niche: copy this file, rename to <niche>.yaml,
# and change the values.

brand_name: "QuadStar Deals"
brand_hashtag: "#QuadStarDeals"
affiliate_tag: "quadstar0e-20"

# Aggregator sources (scraped via Firecrawl)
deal_sources:
  - name: "Slickdeals"
    url: "https://slickdeals.net/deals/amazon/"
    type: "aggregator"
  - name: "DealNews"
    url: "https://www.dealnews.com/s386/Amazon/"
    type: "aggregator"
  - name: "Camelcamelcamel"
    url: "https://camelcamelcamel.com/top_drops/electronics"
    type: "aggregator"

