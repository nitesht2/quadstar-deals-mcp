# QuadStar Deals — Reply Target Accounts
#
# Tier 1: High-value tech reviewers + large deal-adjacent audiences
# Tier 2: Deal/savings focused, price-conscious audiences
# Tier 3: Supporting tech coverage
#
# topic_filters: tweets must match allowed_topics (if set) and not match blocked_topics
# lookback_hours: how far back to search (should match run frequency = 0.5h)

lookback_hours: 0.5
max_cards_per_run: 5
max_results_per_user: 10

tiers:
  Tier 1:
    - username: MKBHD
      display: "Marques Brownlee"
      topic_filters:
        allowed_topics:
          - review
          - tested
          - deal
          - discount
          - price
          - buy
          - worth
          - headphone
          - laptop
          - phone
          - camera
          - monitor
          - earbuds
          - charging
          - battery
          - storage
        blocked_topics:
          - politics
          - election
          - vote

